<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lander Rescue</title>
<style>
:root {
--bg-color: #040710;
--panel-bg: #0b1221;
--border-color: #1a2642;
--hover-color: #293c61;
--text-color: #a6c2ff;
--accent-color: #4da6ff;
--danger-color: #ff4d4d;
--ui-font: 'Courier New', Courier, monospace;
}
body {
margin: 0;
overflow: hidden;
background-color: var(--bg-color);
color: var(--text-color);
font-family: var(--ui-font);
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
width: 100vw;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
touch-action: none;
font-weight: bold;
box-sizing: border-box;
}
canvas {
display: block;
background-color: var(--bg-color);
max-width: 100vw;
max-height: 100vh;
aspect-ratio: 16 / 9;
border: 4px solid var(--border-color);
outline: none;
box-sizing: border-box;
object-fit: contain;
touch-action: none;
}
#ui-overlay {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
display: flex;
justify-content: center;
align-items: center;
text-align: center;
flex-direction: column;
pointer-events: none;
z-index: 10;
}
#start-screen,
#game-over-screen {
pointer-events: auto;
background: var(--panel-bg);
padding: 10px;
border: 4px solid var(--text-color);
box-shadow: 0 0 20px var(--border-color);
max-width: 400px;
width: 90%;
border-radius: 0;
}
.hidden {
display: none !important;
}
p {
margin: 0 0 12px 0;
color: #4da6ff;
font-size: 0.8rem;
}
h1 {
font-size: 26px;
margin: 10px;
color: var(--text-color);
text-transform: uppercase;
letter-spacing: 2px;
text-shadow: none;
}
h2 {
font-size: 16px;
color: var(--danger-color);
margin: 20px 0;
text-transform: uppercase;
}

.instruction-grid {
  display: grid;
  /* Venstre kolonne tilpasser seg innholdet, høyre tar resten */
  grid-template-columns: max-content 1fr;
  column-gap: 16px;
  row-gap: 8px;
  background: rgba(4, 7, 16, 0.8);
  padding: 12px 16px;
  border: 2px solid var(--border-color);
  font-size: 14px;
  margin-bottom: 15px;
  align-items: center;
}

.instruction-grid div {
  display: contents; /* Lar strong og tekst ligge direkte i griddet */
}

.instruction-grid strong {
  color: var(--accent-color);
  text-align: left;
  font-family: var(--ui-font);
  white-space: nowrap; /* Sørger for at ARROWS / WASD ALDRI brekker */
}

.instruction-grid span {
  color: var(--text-color);
  text-align: right; /* Justerer handlingen pent til høyre */
  white-space: nowrap;
}

button {
background: var(--panel-bg);
color: var(--text-color);
border: 3px solid var(--border-color);
padding: 15px 30px;
font-size: 18px;
font-weight: bold;
cursor: pointer;
text-transform: uppercase;
font-family: inherit;
margin-top: 8px;
transition: all 0.2s;
width: 100%;
max-width: 400px;
}
button:hover {
background: var(--hover-color);
color: var(--accent-color);
border-color: var(--accent-color);
}
#high-scores {
margin-top: 8px;
padding-top: 2px;
font-size: 20px;
}
#high-scores h3 {
margin: 0 0 10px 0;
color: var(--accent-color);
font-size: 24px;
}
#score-list {
list-style: none;
padding: 0;
margin: 0;
display: flex;
justify-content: center;
gap: 10px;
color: var(--text-color);
font-size: 18px;
}
#touch-controls {
position: absolute;
bottom: 8%;
left: 0;
width: 100%;
display: flex;
justify-content: space-between;
padding: 0 5%;
box-sizing: border-box;
pointer-events: none;
z-index: 50;
}
#touch-controls .d-pad-left,
#touch-controls .d-pad-right {
display: flex;
gap: 15px;
pointer-events: auto;
}
.touch-btn {
background: rgba(11, 18, 33, 0.5);
border: 3px solid rgba(77, 166, 255, 0.4);
color: rgba(166, 194, 255, 0.6);
font-size: 28px;
width: 70px;
height: 70px;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
touch-action: none;
cursor: pointer;
padding: 0;
margin: 0;
font-family: Arial, sans-serif;
}
.touch-btn:active, .touch-btn.active {
background: rgba(41, 60, 97, 0.8);
border-color: var(--accent-color);
color: var(--accent-color);
}
@media (max-width: 768px) {
#touch-controls {
bottom: 5%;
padding: 0 3%;
}
.touch-btn {
width: 60px;
height: 60px;
font-size: 24px;
border-width: 2px;
}
}
</style>
</head>
<body>
<canvas id="gameCanvas" tabindex="1"></canvas>
<div id="ui-overlay">
<div id="start-screen">
<h1>Lander Rescue</h1>
<p>Made by Johnny Heggelund</p>
<div class="instruction-grid">
  <div><strong>ARROWS / WASD</strong> <span>Thrust/Rotate</span></div>
  <div><strong>SPACE</strong> <span>Shoot</span></div>
  <div><strong>RESCUE</strong> <span>Pick Up</span></div>
  <div><strong>DROP</strong> <span>Deliver</span></div>
  <div><strong>ENEMY</strong> <span>Danger</span></div>
  <div><strong>FUEL</strong> <span>Refuel</span></div>
</div>

<button onclick="clickStart()">START MISSION</button>
<button id="continue-option" class="hidden" onclick="clickContinue()">
CONTINUE LEVEL <span id="saved-level-display"></span>
</button>
<div id="high-scores">
<h3>High Scores</h3>
<ol id="score-list">
<li>No missions yet</li>
</ol>
</div>
</div>
<div id="game-over-screen" class="hidden">
<h2 id="game-over-title">MISSION FAILED</h2>
<p id="game-over-message" style="font-size: 24px; margin: 20px 0; color: var(--text-color);">You crashed!</p>
<button onclick="clickStart()">TRY AGAIN</button>
<p class="option-text" style="font-size: 18px; color: var(--hover-color); margin-top: 15px;">(Press ESC for Menu)</p>
</div>
</div>
<div id="touch-controls" class="hidden">
<div class="d-pad-left">
<div class="touch-btn" id="btn-left">&#9664;</div>
<div class="touch-btn" id="btn-right">&#9654;</div>
</div>
<div class="d-pad-right">
<div class="touch-btn" id="btn-fire" style="font-size: 24px;">&#9673;</div>
<div class="touch-btn" id="btn-thrust">&#9650;</div>
</div>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1280;
canvas.height = 720;
const uiOverlay = document.getElementById('ui-overlay');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const gameOverTitle = document.getElementById('game-over-title');
const gameOverMessage = document.getElementById('game-over-message');
const scoreList = document.getElementById('score-list');
const continueOption = document.getElementById('continue-option');
const savedLevelDisplay = document.getElementById('saved-level-display');
const touchControls = document.getElementById('touch-controls');
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const btnThrust = document.getElementById('btn-thrust');
const btnFire = document.getElementById('btn-fire');
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const C_BG = "#040710";
const C_MAIN = "#4da6ff";
const C_DANGER = "#ff4d4d";
const C_WARN = "#ffaa00";
const C_INFO = "#33cc33";
const C_WHITE = "#ffffff";
window.addEventListener('click', () => {
window.focus();
canvas.focus();
if (audioManager.audioCtx && audioManager.audioCtx.state === 'suspended') {
audioManager.audioCtx.resume();
}
});
const HIGH_SCORES_KEY = 'lunarLanderHighScores_en';
const PROGRESS_KEY = 'lunarLanderMaxLevel_en';
let gameState = 'start';
let lander, terrain, stars;
let level = 1;
let score = 0;
let lives = 3;
let camera = { x: 0, y: 0 };
let worldWidth = canvas.width * 3;
let entities = [];
const GRAVITY = 0.003;
const THRUST_POWER = 0.01;
const ROTATION_SPEED = 0.01;
const LIVES_START = 3;
const PEOPLE_PER_TRIP = 5;

const audioManager = {
  audioCtx: null,
  masterGain: null,
  thrustNode: null,
  
  // --- TRINN A: Variabler for ambient-musikk ---
  ambientPlaying: false,
  t1: null, t2: null, t3: null, t4: null, tMode: null,
  MODES: [
    [110.00, 130.81, 146.83, 164.81, 196.00, 220.00, 261.63],
    [110.00, 138.59, 164.81, 185.00, 220.00, 246.94, 277.18],
    [110.00, 116.54, 138.59, 146.83, 164.81, 174.61, 220.00],
    [110.00, 130.81, 164.81, 196.00, 220.00, 261.63, 329.63]
  ],
  currentModeIndex: 0,
  currentScale: [110.00, 130.81, 146.83, 164.81, 196.00, 220.00, 261.63],
  ambientGainNode: null,

  init() {
    if (this.audioCtx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    this.audioCtx = new AudioCtx();
    this.masterGain = this.audioCtx.createGain();
    this.masterGain.gain.value = 0.3;
    this.masterGain.connect(this.audioCtx.destination);
  },


startAmbient() {
    this.init();
    
    // Hvis den allerede kjører, vil vi IKKE starte parallelle looper:
    if (this.ambientPlaying) return; 

    // Rens opp eventuelle gamle timere for sikkerhets skyld
    clearTimeout(this.t1);
    clearTimeout(this.t2);
    clearTimeout(this.t3);
    clearTimeout(this.t4);
    clearTimeout(this.tMode);

    this.ambientPlaying = true;

    if (!this.ambientGainNode) {
      this.ambientGainNode = this.audioCtx.createGain();
      this.ambientGainNode.gain.value = 1.0; 
      this.ambientGainNode.connect(this.masterGain);
    }

    this.loopDrone();
    setTimeout(() => this.loopDrone(), 3000);
    this.loopBass();
    setTimeout(() => this.loopHigh(), 2000);
    this.loopTexture();
    this.tMode = setTimeout(() => this.rotateMode(), 30000);
},

stopAmbient() {
  this.ambientPlaying = false;
  clearTimeout(this.t1);
  clearTimeout(this.t2);
  clearTimeout(this.t3);
  clearTimeout(this.t4);
  clearTimeout(this.tMode);

  // Hvis vi har en aktiv AudioContext, kan vi suspendere eller lukke den helt
  if (this.audioCtx && this.audioCtx.state !== 'closed') {
    this.audioCtx.suspend();
  }
},

  playAtmosphericPad(freq, dur, vol, filterSettings, noiseSettings = {}, lfoSettings = {}) {
    if (!this.ambientPlaying || !this.audioCtx) return;
    const ctx = this.audioCtx;
    const now = ctx.currentTime;
    const actualAttackDuration = 2.5;
    const sustainDuration = dur;
    const releaseDuration = 10.0;

    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const osc3 = ctx.createOscillator();
    osc1.type = 'triangle';
    osc2.type = 'sine';
    osc3.type = 'sine';

    const drift = (Math.random() - 0.5) * 0.5;
    osc1.frequency.setValueAtTime(freq + drift, now);
    osc2.frequency.setValueAtTime(freq - drift, now);
    osc2.detune.value = 1.0;
    osc3.frequency.setValueAtTime(freq * 0.5, now);

    const osc3Gain = ctx.createGain();
    osc3Gain.gain.value = 0.03;
    osc3.connect(osc3Gain);

    const bufferSize = ctx.sampleRate * 2;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    const noiseSource = ctx.createBufferSource();
    noiseSource.buffer = noiseBuffer;
    noiseSource.loop = true;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = noiseSettings.type || 'bandpass';
    noiseFilter.frequency.value = noiseSettings.freq || 800;
    noiseFilter.Q.value = noiseSettings.Q || 3;

    const noiseGain = ctx.createGain();
    noiseGain.gain.value = noiseSettings.volume || 0.1;

    const filter = ctx.createBiquadFilter();
    filter.type = filterSettings.type;
    filter.Q.value = filterSettings.Q || 0.3;

    const initialFilterFreq = filterSettings.initialFreq || (filterSettings.freq ? filterSettings.freq * 0.1 : 200);
    const targetFilterFreq = filterSettings.freq || 1000;
    filter.frequency.setValueAtTime(initialFilterFreq, now);
    filter.frequency.linearRampToValueAtTime(targetFilterFreq, now + actualAttackDuration * 0.8);

    if (lfoSettings.enabled) {
      const lfo = ctx.createOscillator();
      lfo.type = lfoSettings.type || 'sine';
      lfo.frequency.setValueAtTime(lfoSettings.rate || 0.2, now);
      const lfoGain = ctx.createGain();
      lfoGain.gain.setValueAtTime(lfoSettings.depth || 50, now);
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      lfo.start(now);
      lfo.stop(now + actualAttackDuration + sustainDuration + releaseDuration + 0.5);
    }

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol, now + actualAttackDuration);
    gain.gain.linearRampToValueAtTime(vol, now + actualAttackDuration + sustainDuration);
    gain.gain.exponentialRampToValueAtTime(0.001, now + actualAttackDuration + sustainDuration + releaseDuration);

    osc1.connect(filter);
    osc2.connect(filter);
    osc3Gain.connect(filter);
    noiseSource.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(filter);
    filter.connect(gain);
    gain.connect(this.ambientGainNode);

    const totalDuration = actualAttackDuration + sustainDuration + releaseDuration + 1.0;
    osc1.start(now);
    osc2.start(now);
    osc3.start(now);
    noiseSource.start(now);
    osc1.stop(now + totalDuration);
    osc2.stop(now + totalDuration);
    osc3.stop(now + totalDuration);
    noiseSource.stop(now + totalDuration);
  },

  loopDrone() {
    if (!this.ambientPlaying) return;
    const freq = this.currentScale[Math.floor(Math.random() * this.currentScale.length)];
    this.playAtmosphericPad(freq / 2, 14, 0.15, {
      type: 'lowpass', freq: 600, Q: 0.5, initialFreq: 80
    }, {
      volume: 0.1, type: 'bandpass', freq: 800, Q: 3
    }, {
      enabled: true, rate: 0.15, depth: 20
    });
    this.t1 = setTimeout(() => this.loopDrone(), 4000 + Math.random() * 4000);
  },

  loopBass() {
    if (!this.ambientPlaying) return;
    const bassFreq = this.currentScale[0] / 2;
    this.playAtmosphericPad(bassFreq, 16, 0.25, {
      type: 'lowpass', freq: 250, Q: 0.4, initialFreq: 50
    }, {
      volume: 0.05, type: 'bandpass', freq: 600, Q: 2
    }, {
      enabled: true, rate: 0.1, depth: 15
    });
    this.t2 = setTimeout(() => this.loopBass(), 8000 + Math.random() * 6000);
  },

  loopHigh() {
    if (!this.ambientPlaying) return;
    if (Math.random() > 0.4) {
      const freq = this.currentScale[Math.floor(Math.random() * this.currentScale.length)] * 2;
      this.playAtmosphericPad(freq, 10, 0.02, {
        type: 'lowpass', freq: 4000, Q: 0.5, initialFreq: 200
      }, {
        volume: 0.15, type: 'highpass', freq: 1500, Q: 1.8
      }, {
        enabled: true, rate: 0.3, depth: 40
      });
    }
    this.t3 = setTimeout(() => this.loopHigh(), 3000 + Math.random() * 3000);
  },

  playNoiseSweep(vol) {
    if (!this.ambientPlaying || !this.audioCtx) return;
    const ctx = this.audioCtx;
    const now = ctx.currentTime;
    const bufferSize = ctx.sampleRate * 2;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    const source = ctx.createBufferSource();
    source.buffer = noiseBuffer;
    source.loop = true;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 1;
    filter.frequency.setValueAtTime(20, now);
    filter.frequency.linearRampToValueAtTime(1000, now + 10);
    filter.frequency.linearRampToValueAtTime(20, now + 20);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol, now + 1);
    gain.gain.linearRampToValueAtTime(0, now + 18);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.ambientGainNode);
    source.start(now);
    source.stop(now + 20);
  },

  rotateMode() {
    if (!this.ambientPlaying) return;
    this.currentModeIndex = (this.currentModeIndex + 1) % this.MODES.length;
    this.currentScale = this.MODES[this.currentModeIndex];
    const nextShift = 30000 + Math.random() * 20000;
    this.tMode = setTimeout(() => this.rotateMode(), nextShift);
  },

  loopTexture() {
    if (!this.ambientPlaying) return;
    if (Math.random() < 0.5) {
      this.playNoiseSweep(0.08);
    }
    this.t4 = setTimeout(() => this.loopTexture(), 15000 + Math.random() * 20000);
  },

  // --- Her kommer din eksisterende playDropoff ---
  playDropoff() {
    if (!this.audioCtx) return;
    const osc = this.audioCtx.createOscillator();
    const gain = this.audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(400, this.audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
    osc.connect(gain).connect(this.audioCtx.destination);
    osc.start();
    osc.stop(this.audioCtx.currentTime + 0.3);
  },


startThrust() {
  if (!this.audioCtx || this.thrustNode) return;
  
  const now = this.audioCtx.currentTime;
  const noiseSource = this.audioCtx.createBufferSource();
  const bufferSize = this.audioCtx.sampleRate * 2;
  const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
  const output = buffer.getChannelData(0);
  
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }
  
  noiseSource.buffer = buffer;
  noiseSource.loop = true;

  const filter = this.audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 300;
  filter.Q.value = 15;

  const gainNode = this.audioCtx.createGain();
  gainNode.gain.setValueAtTime(0.001, now);
  // Myk tone inn for å unngå knepp i starten også
  gainNode.gain.exponentialRampToValueAtTime(0.50, now + 0.08);

  noiseSource.connect(filter).connect(gainNode).connect(this.masterGain || this.audioCtx.destination);
  noiseSource.start(now);
  
  this.thrustNode = { noiseSource, gainNode };
},

stopThrust() {
  if (!this.thrustNode) return;
  
  const { noiseSource, gainNode } = this.thrustNode;
  this.thrustNode = null; // Tøm referansen umiddelbart slik at ny thrust kan startes ved behov

  const now = this.audioCtx.currentTime;
  const fadeTime = 0.15; // Jevn og silkemyk uttoning

  // Kanseller fremtidige endringer og lås gjeldende volum
  gainNode.gain.cancelScheduledValues(now);
  gainNode.gain.setValueAtTime(gainNode.gain.value, now);
  
  // Rump ned til nær null eksponentielt (Web Audio krever verdi > 0 for exponentialRamp)
  gainNode.gain.exponentialRampToValueAtTime(0.0001, now + fadeTime);

  // Stopp lydkilden FØRST et lite øyeblikk ETTER at volumet er garantert i null
  noiseSource.stop(now + fadeTime + 0.02);
},

playExplosion() {
  if (!this.audioCtx) return;
  const now = this.audioCtx.currentTime;

  // 1. Create noise buffer (1.5 seconds)
  const bufferSize = this.audioCtx.sampleRate * 1.5;
  const buffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
  const output = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

  const noiseSource = this.audioCtx.createBufferSource();
  noiseSource.buffer = buffer;

  // 2. Add Lowpass Filter to cut high frequencies and drop pitch for rumble
  const filter = this.audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(600, now); // Initial impact punch
  filter.frequency.exponentialRampToValueAtTime(30, now + 1.2); // Sweep down to deep bass rumble

  // 3. Volume Envelope
  const gainNode = this.audioCtx.createGain();
  gainNode.gain.setValueAtTime(0.7, now);
  gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

  // Connect noise -> filter -> gain -> speakers
  noiseSource.connect(filter).connect(gainNode).connect(this.audioCtx.destination);
  noiseSource.start();
},

playLand() {
if (!this.audioCtx) return;
const osc = this.audioCtx.createOscillator();
const gain = this.audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(150, this.audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(50, this.audioCtx.currentTime + 0.2);
gain.gain.setValueAtTime(0.4, this.audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.3);
osc.connect(gain).connect(this.audioCtx.destination);
osc.start();
osc.stop(this.audioCtx.currentTime + 0.3);
},
playPickup() {
if (!this.audioCtx) return;
const osc = this.audioCtx.createOscillator();
const gain = this.audioCtx.createGain();
osc.type = 'square';
osc.frequency.setValueAtTime(400, this.audioCtx.currentTime);
osc.frequency.linearRampToValueAtTime(800, this.audioCtx.currentTime + 0.1);
gain.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.2);
osc.connect(gain).connect(this.audioCtx.destination);
osc.start();
osc.stop(this.audioCtx.currentTime + 0.2);
},
playDropoff() {
if (!this.audioCtx) return;
const osc = this.audioCtx.createOscillator();
const gain = this.audioCtx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(800, this.audioCtx.currentTime);
osc.frequency.linearRampToValueAtTime(400, this.audioCtx.currentTime + 0.2);

function generateLevel(level) {
entities = [];
const segments = 450;
const roughness = 0.15 + (level * 0.012);
const padWidthSegments = Math.max(4, 20 - Math.floor(level * 0.32));
const bufferSegments = 5;
const padWidth = (padWidthSegments / segments) * worldWidth;
const padIndices = [
Math.floor(segments * 0.2) + Math.floor(Math.random() * 20 - 10),
Math.floor(segments * 0.5) + Math.floor(Math.random() * 20 - 10),
Math.floor(segments * 0.8) + Math.floor(Math.random() * 20 - 10)
].map(idx => {
if (idx + padWidthSegments + (bufferSegments * 2) > segments) {
return segments - (padWidthSegments + (bufferSegments * 2)) - 1;
}
return Math.max(0, idx);
});
const padTypes = ['rescue', 'fuel', 'dropoff'];
const points = [];
let y = canvas.height * (0.6 + Math.random() * 0.2);
let currentPad = 0;
let flatSegmentsLeft = 0;
for (let i = 0; i <= segments; i++) {
points.push({ x: (i / segments) * worldWidth, y: y });
if (currentPad < padIndices.length && i === padIndices[currentPad]) {
flatSegmentsLeft = padWidthSegments + (bufferSegments * 2);
currentPad++;
}
if (flatSegmentsLeft > 0) {
flatSegmentsLeft--;
} else {
y += (Math.random() - 0.5) * canvas.height * roughness;
if (y < canvas.height * 0.4) y = canvas.height * 0.4;
if (y > canvas.height - 40) y = canvas.height - 40;
}
}
terrain = { points };
padIndices.forEach((startIndex, i) => {
const padY = points[startIndex].y;
const padX = points[startIndex + bufferSegments].x;
const padType = padTypes[i];
entities.push(new LandingPad(padX, padY, padWidth, padType));
if (padType === 'rescue') {
for (let p = 0; p < PEOPLE_PER_TRIP; p++) {
const personX = padX + (padWidth / 2) + (Math.random() * 80 - 40);
entities.push(new Person(personX, padY, 'waiting'));
}
}
});
const numEnemies = Math.floor(Math.max(0, level - 2) * 0.4);
const padBuffer = canvas.width / 4;
const bomberFlatSegments = 5;
const halfBomberWidth = Math.floor(bomberFlatSegments / 2);
let tries = 0;
for (let i = 0; i < numEnemies; i++) {
if (tries > 500) break;
tries++;
const safeZoneSegments = Math.floor(segments * 0.15);
const segRange = segments - bomberFlatSegments - safeZoneSegments * 2;
const enemySeg = Math.floor(Math.random() * segRange) + safeZoneSegments + halfBomberWidth;
const enemyX = points[enemySeg].x;
let localMinY = canvas.height;
for (let j = -halfBomberWidth; j <= halfBomberWidth; j++) {
if(points[enemySeg + j].y < localMinY) localMinY = points[enemySeg + j].y;
}
let tooCloseToPad = false;
for (let j = -halfBomberWidth; j <= halfBomberWidth; j++) {
const checkX = points[enemySeg + j].x;
if (entities.some(e => e instanceof LandingPad && checkX > (e.x - padBuffer) && checkX < (e.x + e.width + padBuffer))) {
tooCloseToPad = true;
break;
}
}
if (!tooCloseToPad) {
for (let j = -halfBomberWidth; j <= halfBomberWidth; j++) {
points[enemySeg + j].y = localMinY;
}
entities.push(new EnemyLauncher(enemyX, localMinY));
tries = 0;
} else {
i--;
}
}
}

function getTerrainYAtX(x) {
if (!terrain || !terrain.points) return canvas.height;
if (x <= 0) return terrain.points[0].y;
if (x >= worldWidth) return terrain.points[terrain.points.length - 1].y;
for (let i = 0; i < terrain.points.length - 1; i++) {
const p1 = terrain.points[i];
const p2 = terrain.points[i + 1];
if (x >= p1.x && x <= p2.x) {

if (eIdx < index) index--;
for (let p = 0; p < 40; p++) {
entities.push(new Particle(e.x, e.y - e.height/2));
}
audioManager.playExplosion();
score += 500;
break;
}
}
}
if (hit || entity.life <= 0 || entity.y > getTerrainYAtX(entity.x)) {
entities.splice(index, 1);
}
} else if (entity instanceof Particle) {
if (entity.life <= 0) entities.splice(index, 1);
}
}
if (crashedIntoTerrain && !lander.landed) {
handleLanding(collisionY);
}
if (lander.x < 0 || lander.x > worldWidth || lander.y < -canvas.height) {
handleCrash("Lost in space!");
}
}
function handleLanding(groundY) {
if (lander.crashed) return;
audioManager.stopThrust();
const cos = Math.cos(lander.angle);
const sin = Math.sin(lander.angle);
const h2 = lander.height / 2;
const w2 = lander.width / 2;
const leftLegX = lander.x + (-w2 * cos) - (h2 * sin);
const rightLegX = lander.x + (w2 * cos) - (h2 * sin);
const tYLeft = getTerrainYAtX(leftLegX);
const tYRight = getTerrainYAtX(rightLegX);
const isFlat = Math.abs(tYLeft - tYRight) < 3;
const maxVel = getMaxLandingVelocity();
const safeAngle = Math.abs(lander.angle) < 0.2;
const safeVelocity = Math.abs(lander.vx) < maxVel.x && Math.abs(lander.vy) < maxVel.y;
let padLandedOn = null;
entities.forEach(e => {
if (e instanceof LandingPad) {
if (rightLegX > e.x && leftLegX < e.x + e.width) {
padLandedOn = e;
}
}
});
if (padLandedOn) {
if (leftLegX >= padLandedOn.x - 2 && rightLegX <= padLandedOn.x + padLandedOn.width + 2) {
if (safeAngle && safeVelocity) {
lander.y = padLandedOn.y - lander.height / 2;
lander.landed = true;
lander.vx = 0;
lander.vy = 0;
lander.angle = 0;
switch (padLandedOn.type) {
case 'rescue':
entities.forEach(e => {
if (e instanceof Person && e.state === 'waiting') {
e.state = 'walkingToLander';
}
});
break;
case 'dropoff':
if (lander.people > 0) {
const droppedCount = lander.people;
for (let i = 0; i < droppedCount; i++) {
const p = new Person(lander.x, padLandedOn.y, 'walkingAway');
p.targetX = padLandedOn.x + (Math.random() * padLandedOn.width);
entities.push(p);
}
audioManager.playDropoff();
const fuelBonus = Math.round(lander.fuel * 2);
const landingBonus = 500 * droppedCount;
const levelBonus = level * 1000;
score += fuelBonus + landingBonus + levelBonus;
lander.people = 0;
saveProgress(level + 1);
if (level === 50) {
setTimeout(() => {
gameState = 'gameOver';
saveHighScore(score);
showEndScreen("CONGRATULATIONS!", `You beat the game! Final Score: ${score}`, "Press [ENTER] to play again");
}, 2000);
} else {
setTimeout(() => {
gameState = 'levelComplete';
showEndScreen("MISSION SUCCESSFUL", `Level ${level} complete! Score: ${score}`, "Press [ENTER] for next level");
}, 2000);
}
} else {
audioManager.playLand();
}
break;
case 'fuel':
lander.fuel = Math.max(lander.fuel, Math.max(400, 1800 - (level * 28)));
audioManager.playPickup();
break;
}
} else {
handleCrash(!safeAngle ? "Bad landing angle!" : "Landed too fast!");
}
} else {
handleCrash("One leg missed the pad!");
}
} else {
if (isFlat && safeAngle && safeVelocity) {
lander.y = groundY - lander.height / 2;
lander.landed = true;
lander.vx = 0;
lander.vy = 0;
lander.angle = 0;
audioManager.playLand();
} else {
if (!isFlat) handleCrash("Terrain isn't flat enough!");
else if (!safeAngle) handleCrash("Bad landing angle!");
else handleCrash("Landed too fast!");
}
}
}
function handleCrash(message) {
if (lander.crashed) return;
lander.crashed = true;
for (let p = 0; p < 80; p++) {
entities.push(new Particle(lander.x, lander.y));
}
audioManager.playExplosion();
lives--;
audioManager.stopThrust();
keys.ArrowUp = false;
setTimeout(() => {
if (lives <= 0) {
gameState = 'gameOver';
saveHighScore(score);
showEndScreen("MISSION FAILED", message, "Press [ENTER] to retry level " + level);
} else {
generateLevel(level);
lander.reset();
}
}, 1500);
}
function startGame(startLevel) {

audioManager.startAmbient();

level = startLevel;
if (gameState === 'start' || gameState === 'gameOver') {
score = 0;
lives = LIVES_START;
}
audioManager.init();
entities = [];
generateLevel(level);
lander = new Lander(100, 50);
lander.vx = 0.5;
gameState = 'playing';
uiOverlay.classList.add('hidden');
startScreen.classList.add('hidden');
gameOverScreen.classList.add('hidden');
if (isTouchDevice) {
touchControls.classList.remove('hidden');
}
canvas.focus();
}
function showEndScreen(title, message, prompt) {
displayHighScores();
gameOverTitle.textContent = title;
gameOverMessage.textContent = message;
const btn = gameOverScreen.querySelector('button');
if (title.includes("SUCCESSFUL") || title.includes("CONGRATULATIONS")) {
btn.textContent = "NEXT MISSION";
} else {
btn.textContent = "TRY AGAIN";
}
gameOverScreen.classList.remove('hidden');
uiOverlay.classList.remove('hidden');
startScreen.classList.add('hidden');
touchControls.classList.add('hidden');
}
function updateCamera() {
camera.x = lander.x - canvas.width / 2;
camera.x = Math.max(0, Math.min(camera.x, worldWidth - canvas.width));
camera.y = 0;
}
function gameLoop() {

if (gameState === 'playing') {
  lander.thrusting = false;
  if (keys.ArrowUp || keys.KeyW) lander.applyThrust();
  if (keys.Space) lander.fire();
  if ((keys.ArrowLeft || keys.KeyA) && !lander.landed) lander.rotate(-1);
  if ((keys.ArrowRight || keys.KeyD) && !lander.landed) lander.rotate(1);

lander.update();
entities.forEach(e => {
if (typeof e.update === 'function') e.update();
});
checkCollisions();
updateCamera();
}
ctx.clearRect(0, 0, canvas.width, canvas.height);
drawStars();
if (gameState !== 'start') {
ctx.save();
ctx.translate(-camera.x, -camera.y);
drawTerrain();
entities.forEach(e => e.draw());
if (lander) lander.draw();
ctx.restore();
if (gameState === 'playing') drawHUD();
}
requestAnimationFrame(gameLoop);
}
window.clickStart = function() {
canvas.focus();
if (audioManager.audioCtx && audioManager.audioCtx.state === 'suspended') {
audioManager.audioCtx.resume();
}
if (gameState === 'start' || gameState === 'gameOver') {
startGame(1);
} else if (gameState === 'levelComplete') {
startGame(level + 1);
}
};
window.clickContinue = function() {
canvas.focus();
if (audioManager.audioCtx && audioManager.audioCtx.state === 'suspended') {
audioManager.audioCtx.resume();
}
const savedLvl = loadProgress();
if (savedLvl > 1) startGame(savedLvl);
};
(function() {
const hideStyle = 'cursor: none !important;';
const showStyle = 'cursor: default !important;';
const setCursor = (style) => {
document.documentElement.style.cssText += style;
document.body.style.cssText += style;
document.querySelectorAll('canvas, iframe, object, embed').forEach(el => {
el.style.cssText += style;
});
};
window.addEventListener('keydown', () => setCursor(hideStyle), true);
window.addEventListener('mousemove', () => setCursor(showStyle), true);
})();

// Stopp all lyd umiddelbart når brukeren lukker fanen eller går bort fra siden
window.addEventListener('pagehide', () => {
  if (audioManager) {
    audioManager.stopAmbient();
    if (audioManager.audioCtx) {
      audioManager.audioCtx.close();
    }
  }
});

window.addEventListener('beforeunload', () => {
  if (audioManager) {
    audioManager.stopAmbient();
    if (audioManager.audioCtx) {
      audioManager.audioCtx.close();
    }
  }
});

window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code) || ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
}, false);

generateStars();
updateStartScreenUI();
gameLoop();
</script>
